<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in · Access Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>
<main class="auth-page"><div class="auth-card"><span class="eyebrow"><span class="eyebrow-dot"></span> GOOD TO HAVE YOU HERE</span><h1>Welcome <span>back.</span></h1>
    <div class="notice notice-success" th:if="${param.registered}">Your account is ready. Log in to share your experience.</div>
    <div class="notice notice-error" th:if="${param.error}">That email or password didn’t match. Please try again.</div>
    <form th:action="@{/login}" method="post"><label for="username">Email address</label><input id="username" type="email" name="username" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required><button class="button button-dark button-full" type="submit">Log in <span>→</span></button></form>
    <p class="auth-switch">New to Access Atlas? <a th:href="@{/register}">Create an account</a></p>
</div></main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
