spring.application.name=accessibility-mapper
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/accessibility-mapper;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=12MB
app.upload-dir=${UPLOAD_DIR:uploads}
app.seed-demo-data=${SEED_DEMO_DATA:true}
app.admin-email=${ADMIN_EMAIL:admin@access.org}
app.admin-password=${ADMIN_PASSWORD:mapaccess}
app.member-email=${MEMBER_EMAIL:mapper@access.org}
app.member-password=${MEMBER_PASSWORD:mapaccess}
server.error.include-message=never
server.error.include-stacktrace=never
