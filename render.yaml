services:
  - type: web
    name: bangalore-accessibility-mapper
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /
    disk:
      name: accessibility-mapper-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_URL
        value: jdbc:h2:file:/var/data/accessibility-mapper;MODE=MySQL;DATABASE_TO_LOWER=TRUE
      - key: DB_USERNAME
        value: sa
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ADMIN_EMAIL
        value: admin@access.org
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MEMBER_EMAIL
        value: mapper@access.org
      - key: MEMBER_PASSWORD
        generateValue: true
